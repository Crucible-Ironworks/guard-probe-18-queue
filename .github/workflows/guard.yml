name: guard
on: [pull_request, merge_group]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "event=${{ github.event_name }} sha=${{ github.sha }} base=${{ github.event.merge_group.base_sha }} head=${{ github.event.merge_group.head_sha }}"
          if [ -f a ] && [ -f b ]; then echo "conflict: a and b together"; exit 1; fi
